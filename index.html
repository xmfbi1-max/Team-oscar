<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصويت الغداء</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.05)} 100%{transform:scale(1)} }
    .option-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .option-card:hover:not(.voted) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .option-card.animating { animation: pop 0.5s ease; }
    .bar-fill { transition: width 1s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const QUESTION = "من هوا افضل مصمم في تيم اوسكار؟";
    const OPTIONS = [
      { id: "new", label: "ابو محمد" },
      { id: "office", label: "علي" },
      { id: "regular", label: "7UO" },
      { id: "any", label: "DAMAR" },
    ];

    const COLORS = ["#6C63FF", "#FF6584", "#43C6AC", "#F7971E"];
    const STORAGE_KEY = "lunch-poll-votes-v1";
    const MY_VOTE_KEY = "lunch-poll-myvote-v1";
    const EMPTY_VOTES = { new: 0, office: 0, regular: 0, any: 0 };

    function parseVotes(stored) {
      if (!stored) return { ...EMPTY_VOTES };
      try {
        const parsed = JSON.parse(stored.value);
        return OPTIONS.reduce((acc, o) => {
          acc[o.id] = Number(parsed[o.id]) || 0;
          return acc;
        }, {});
      } catch {
        return { ...EMPTY_VOTES };
      }
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `${r},${g},${b}`;
    }

    function VoteApp() {
      const [votes, setVotes] = useState({ ...EMPTY_VOTES });
      const [myVote, setMyVote] = useState(() => {
        try { return localStorage.getItem(MY_VOTE_KEY) || null; } catch { return null; }
      });
      const [loading, setLoading] = useState(true);
      const [animating, setAnimating] = useState(null);
      const isVotingRef = useRef(false);

      const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);

      const loadVotes = useCallback(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          setVotes(parseVotes({value: stored}));
        } catch {}
        setLoading(false);
      }, []);

      useEffect(() => {
        loadVotes();
        const interval = setInterval(loadVotes, 3000);
        return () => clearInterval(interval);
      }, [loadVotes]);

      const handleVote = (optionId) => {
        if (myVote || isVotingRef.current) return;
        isVotingRef.current = true;

        setMyVote(optionId);
        setAnimating(optionId);
        try { localStorage.setItem(MY_VOTE_KEY, optionId); } catch {}

        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          const latest = parseVotes({value: stored});
          const newVotes = { ...latest, [optionId]: latest[optionId] + 1 };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(newVotes));
          setVotes(newVotes);
        } catch {
          setVotes(prev => ({ ...prev, [optionId]: prev[optionId] + 1 }));
        }

        setTimeout(() => {
          setAnimating(null);
          isVotingRef.current = false;
        }, 600);
      };

      const getPercent = (id) => {
        if (totalVotes === 0) return 0;
        return Math.round((votes[id] / totalVotes) * 100);
      };

      const maxVotes = Math.max(...Object.values(votes));
      const leaderId = maxVotes > 0 ? OPTIONS.find(o => votes[o.id] === maxVotes)?.id : null;

      return (
        <div style={{
          minHeight: "100vh",
          background: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontFamily: "'Cairo', 'Tajawal', sans-serif",
          direction: "rtl",
          padding: "20px",
        }}>
          <div style={{
            width: "100%",
            maxWidth: 460,
            background: "rgba(255,255,255,0.06)",
            backdropFilter: "blur(20px)",
            borderRadius: 28,
            border: "1px solid rgba(255,255,255,0.12)",
            padding: "36px 28px",
            boxShadow: "0 40px 80px rgba(0,0,0,0.5)",
            animation: "fadeIn 0.5s ease",
          }}>
            {/* Header */}
            <div style={{ marginBottom: 28, textAlign: "center" }}>
              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", letterSpacing: 3, marginBottom: 10 }}>
                تصويت جماعي
              </div>
              <h1 style={{ fontSize: 24, fontWeight: 900, color: "#fff", margin: 0, lineHeight: 1.5 }}>
                {QUESTION}
              </h1>
              <div style={{ marginTop: 10, fontSize: 14, color: "rgba(255,255,255,0.45)" }}>
                {loading
                  ? "جاري التحميل..."
                  : totalVotes === 0
                  ? "كن أول من يصوت!"
                  : `${totalVotes} صوت إجمالي${myVote ? " · صوّتت ✓" : ""}`}
              </div>
            </div>

            {/* Options */}
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {OPTIONS.map((opt, i) => {
                const pct = getPercent(opt.id);
                const count = votes[opt.id];
                const isLeader = opt.id === leaderId && totalVotes > 0;
                const isMyVote = myVote === opt.id;
                const color = COLORS[i];

                return (
                  <div
                    key={opt.id}
                    className={`option-card${myVote ? " voted" : ""}${animating === opt.id ? " animating" : ""}`}
                    onClick={() => handleVote(opt.id)}
                    style={{
                      position: "relative",
                      borderRadius: 16,
                      overflow: "hidden",
                      border: isMyVote
                        ? `2px solid ${color}`
                        : isLeader
                        ? "2px solid rgba(255,255,255,0.18)"
                        : "2px solid rgba(255,255,255,0.07)",
                      background: isMyVote
                        ? `rgba(${hexToRgb(color)}, 0.12)`
                        : "rgba(255,255,255,0.04)",
                      cursor: myVote ? "default" : "pointer",
                    }}
                  >
                    {/* Progress bar */}
                    {myVote && (
                      <div
                        className="bar-fill"
                        style={{
                          position: "absolute",
                          top: 0,
                          right: 0,
                          height: "100%",
                          width: `${pct}%`,
                          background: `linear-gradient(270deg, rgba(${hexToRgb(color)},0.25), rgba(${hexToRgb(color)},0.05))`,
                          borderRadius: 16,
                          pointerEvents: "none",
                        }}
                      />
                    )}

                    {/* Content */}
                    <div style={{
                      position: "relative",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      padding: "15px 18px",
                      gap: 8,
                    }}>
                      {/* Label side */}
                      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                        <div style={{
                          width: 10, height: 10,
                          borderRadius: "50%",
                          background: isMyVote ? color : "rgba(255,255,255,0.2)",
                          flexShrink: 0,
                          boxShadow: isMyVote ? `0 0 8px ${color}` : "none",
                          transition: "all 0.3s",
                        }} />
                        <span style={{
                          fontSize: 16,
                          fontWeight: isMyVote || isLeader ? 700 : 500,
                          color: "#fff",
                        }}>
                          {opt.label}
                        </span>
                        {isLeader && totalVotes > 0 && (
                          <span style={{
                            fontSize: 10,
                            background: color,
                            color: "#fff",
                            borderRadius: 20,
                            padding: "2px 8px",
                            fontWeight: 700,
                            flexShrink: 0,
                            }}>متقدم 🏆</span>
                        )}
                        {isMyVote && <span style={{ fontSize: 13, color, flexShrink: 0 }}>✓</span>}
                      </div>

                      {/* Stats side */}
                      {myVote && (
                        <div style={{
                          display: "flex",
                          flexDirection: "column",
                          alignItems: "flex-end",
                          gap: 1,
                          flexShrink: 0,
                        }}>
                          <span style={{
                            fontSize: 20,
                            fontWeight: 800,
                            color: isMyVote ? color : "rgba(255,255,255,0.65)",
                            lineHeight: 1,
                          }}>
                            {pct}%
                          </span>
                          <span style={{
                            fontSize: 12,
                            fontWeight: 500,
                            color: isMyVote ? `rgba(${hexToRgb(color)}, 0.8)` : "rgba(255,255,255,0.3)",
                            lineHeight: 1,
                          }}>
                            {count} {count === 1 ? "صوت" : "أصوات"}
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer */}
            <div style={{ marginTop: 22, textAlign: "center", fontSize: 12, color: "rgba(255,255,255,0.22)" }}>
              {myVote ? "يتحدث تلقائياً كل 3 ثوان 🔄" : "اضغط على خيار للتصويت"}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<VoteApp />, document.getElementById('root'));
  </script>
</body>
</html>
